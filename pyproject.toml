[build-system]
requires = [
    "setuptools",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-aop"
version = "0.1.0"
dependencies = [
    "aspectlib",
    "requests",
    "python-dotenv",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "commitizen",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "poethepoet",
    "pydoc-markdown",
    "typer",
]

[project.scripts]
ghost-run = "src.main:main"

[tool.poe.tasks]
setup = "python tasks.py"
test = "pytest"
test-ci = "pytest --cov=src tests/ --cov-report=term-missing --cov-fail-under=80"
lint = "ruff check ."
format = "ruff format ."
docs-build = "mkdocs build"
docs-serve = "mkdocs serve"

[tool.pydoc-markdown]
loaders = [
    { type = "python", search_path = [
        "src/pipeline", "src/"
        ]}
]
renderer = {type = "markdown"}

[tool.pytest.ini_options]
xfail_strict = true
addopts = [
    "--cov=src",
    "--cov-report=term-missing",
    "--tb=short",
    "--strict-markers",
]
pythonpath = [
    ".",
]
testpaths = [
    "tests",
]

[tool.coverage.run]
omit = [
    "src/main.py",
    "src/pipeline/__init__.py",
]
